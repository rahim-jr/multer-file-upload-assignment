<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multer Upload Example</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Multer + Express — File Upload Example</h1>

    <h2>Single file</h2>
    <form id="singleForm">
      <input type="file" name="myFile" id="singleFile" accept="image/*" />
      <button type="submit">Upload</button>
    </form>

    <h3>Result</h3>
    <pre id="result">No uploads yet.</pre>

    <script src="./script.js"></script>
  </body>
</html>
